openapi: 3.1.0
info:
  title: Dash API
  version: 0.1.0
  description: >
    Single source of truth for the Dash API. The TypeScript client in
    packages/api-client is generated from this file — do not hand-write
    API types in the frontend.
servers:
  - url: /
paths:
  /api/healthz:
    get:
      operationId: healthz
      summary: Liveness + database reachability probe
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/sections:
    get:
      operationId: listSections
      summary: Full board — sections with nested items and urls, ordered
      responses:
        "200":
          description: Ordered board tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Section"
    post:
      operationId: createSection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionInput"
      responses:
        "201":
          description: Created section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"

  /api/sections/{id}:
    patch:
      operationId: updateSection
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionPatch"
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSection
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Section and its items deleted

  /api/sections/reorder:
    post:
      operationId: reorderSection
      summary: Move a section between two neighbors (fractional position)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reorder"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/items/{id}:
    patch:
      operationId: updateItem
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteItem
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Item deleted

  /api/items/{id}/icon:
    post:
      operationId: uploadIcon
      summary: Upload an icon file; returns the stored icon reference
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Icon stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/items/reorder:
    post:
      operationId: reorderItem
      summary: Move an item between two neighbors, optionally across sections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemReorder"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/icons/{file}:
    get:
      operationId: getIcon
      summary: Serve an uploaded icon file
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Icon bytes
        "404":
          $ref: "#/components/responses/NotFound"

  /api/monitors:
    get:
      operationId: listMonitors
      summary: All monitors with live uptime stats
      responses:
        "200":
          description: Monitors ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonitorView"
    post:
      operationId: createMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorInput"
      responses:
        "201":
          description: Created monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorView"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/monitors/{id}:
    get:
      operationId: getMonitor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Monitor with stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorView"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMonitor
      summary: Sparse update; `active` toggles pause/resume
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorInput"
      responses:
        "200":
          description: Updated monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorView"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMonitor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Monitor and its heartbeats deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/monitors/{id}/heartbeats:
    get:
      operationId: monitorHeartbeats
      parameters:
        - $ref: "#/components/parameters/id"
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
            maximum: 720
      responses:
        "200":
          description: Check history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Heartbeat"

  /api/monitors/{id}/check:
    post:
      operationId: checkMonitorNow
      summary: Run one check synchronously
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Monitor after the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorView"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/push/{token}:
    get:
      operationId: pushMonitorGet
      summary: Record an up heartbeat for a push monitor
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: msg
          in: query
          schema:
            type: string
        - name: ping
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Heartbeat recorded
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: pushMonitorPost
      summary: Record an up heartbeat for a push monitor
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: msg
          in: query
          schema:
            type: string
        - name: ping
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Heartbeat recorded
        "404":
          $ref: "#/components/responses/NotFound"

  /api/domains:
    get:
      operationId: listDomains
      summary: All tracked domains with expiry countdowns
      responses:
        "200":
          description: Domains ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainView"
    post:
      operationId: createDomain
      summary: Track a domain; runs the first WHOIS/DNS/SSL lookup inline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainInput"
      responses:
        "201":
          description: Domain after the initial lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Domain already tracked

  /api/domains/{id}:
    get:
      operationId: getDomain
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Domain detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainView"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDomain
      summary: Sparse update — settings fields only; lookup data is refreshed separately
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainInput"
      responses:
        "200":
          description: Updated domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainView"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDomain
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Domain and its check history deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/domains/{id}/refresh:
    post:
      operationId: refreshDomain
      summary: Re-run WHOIS/RDAP + DNS + TLS + geo lookup now
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Domain after the refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainView"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/domains/{id}/checks:
    get:
      operationId: domainChecks
      summary: Snapshot history for change detection
      parameters:
        - $ref: "#/components/parameters/id"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Snapshots, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainCheck"

  /api/widgets/types:
    get:
      operationId: widgetTypes
      summary: Widget registry metadata — drives the add-widget dialog
      responses:
        "200":
          description: Registered widget types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WidgetType"

  /api/widgets/{id}/data:
    get:
      operationId: widgetData
      summary: Live data for one widget item (~30s server-side cache)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Widget payload; shape depends on config.type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Upstream service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/status:
    get:
      operationId: getStatus
      summary: Reachability of each service item's primary URL (~60s server cache)
      responses:
        "200":
          description: Status map keyed by item id
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/Status"

  /api/notify/test:
    post:
      operationId: notifyTest
      summary: Send a test notification to the configured webhook
      description: Requires the `notify_webhook` settings key to hold an http(s) URL.
      responses:
        "200":
          description: Test notification dispatched
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/systems:
    get:
      operationId: listSystems
      responses:
        "200":
          description: All monitored systems with their latest sample
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/System"
    post:
      operationId: createSystem
      summary: Register a system; the returned token authenticates agent pushes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/systems/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      operationId: getSystem
      responses:
        "200":
          description: System detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchSystem
      summary: Rename or rotate the agent token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                rotateToken: { type: boolean }
      responses:
        "200":
          description: Updated system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSystem
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/systems/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      operationId: systemStats
      summary: Stored agent samples for charting
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24, maximum: 168 }
      responses:
        "200":
          description: Samples oldest-to-newest
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/StatSample"
                    - type: object
                      properties:
                        ts: { type: string, format: date-time }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/systems/ingest:
    post:
      operationId: ingestSystem
      summary: "Agent push endpoint; Authorization: Bearer <system token>"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatSample"
      responses:
        "200":
          description: Sample stored
        "401":
          description: Missing or unknown token
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/incidents:
    get:
      operationId: listIncidents
      parameters:
        - name: status
          in: query
          description: "`open` filters to open+ack"
          schema: { type: string }
      responses:
        "200":
          description: Incidents newest-first, updates embedded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      operationId: createIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: Created incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      operationId: patchIncident
      summary: Update fields; a status change appends a timeline entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteIncident
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/incidents/{id}/updates:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: addIncidentUpdate
      summary: Append a timeline note; `status` also moves the incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "200":
          description: Incident with updated timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/maintenance:
    get:
      operationId: listWindows
      responses:
        "200":
          description: Maintenance windows newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceWindow"
    post:
      operationId: createWindow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceWindowInput"
      responses:
        "201":
          description: Created window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceWindow"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/maintenance/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      operationId: deleteWindow
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/status-pages:
    get:
      operationId: listStatusPages
      responses:
        "200":
          description: All status pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusPage"
    post:
      operationId: createStatusPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPageInput"
      responses:
        "201":
          description: Created page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPage"
        "409":
          description: Slug already in use
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/status-pages/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      operationId: patchStatusPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPageInput"
      responses:
        "200":
          description: Updated page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPage"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStatusPage
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/status-pages/{slug}/public:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: publicStatus
      summary: Live public view for a status page
      responses:
        "200":
          description: Title, overall state, monitors, systems, incidents, maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/badge/{kind}/{file}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [monitor, domain, system] }
      - name: file
        in: path
        required: true
        description: "Entity id, conventionally suffixed .svg"
        schema: { type: string }
    get:
      operationId: badge
      summary: Stateless SVG shield from live state
      responses:
        "200":
          description: SVG badge
          content:
            image/svg+xml: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /api/metrics:
    get:
      operationId: metrics
      summary: Prometheus text exposition
      responses:
        "200":
          description: text/plain metrics
          content:
            text/plain: {}

  /api/import/csv:
    post:
      operationId: importCSV
      summary: "Bulk import from CSV; ?kind=monitors|domains"
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [monitors, domains], default: monitors }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped: { type: integer }
                  errors:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: All settings as key/value map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      operationId: putSettings
      summary: Merge settings (keys not sent are preserved)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Full settings map after merge
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/export:
    get:
      operationId: exportBoard
      summary: Full JSON backup (sections, items, urls, settings)
      responses:
        "200":
          description: Board export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"

  /api/import:
    post:
      operationId: importBoard
      summary: Replace board state from an export payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Export"
      responses:
        "200":
          description: Imported board tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Section"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/import/external:
    post:
      operationId: importExternal
      summary: >
        Import a foreign dashboard config — Homepage services.yml, Homarr
        JSON export, or Dashy conf.yml. Format is auto-detected; the board
        is replaced and existing settings are preserved.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: string
              format: binary
          text/yaml:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Imported board tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Section"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
