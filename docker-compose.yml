services:
  dash:
    # Prebuilt release image — `docker compose pull && docker compose up -d`.
    # To build from source instead: `docker compose up -d --build`.
    image: ghcr.io/dvorinka/dash:latest
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # CasaOS: use infra/compose.casaos.yaml — CasaOS runs compose from /tmp,
      # so this relative path fails there and would not survive a reboot.
      - ./data:/data
    restart: unless-stopped
